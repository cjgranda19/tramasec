<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600&display=swap">
<title>Tramasec · Panel de contenido</title>
<style>:root{--surface:#ffffff;--surface-soft:#f3f8fb;--celeste-100:#e6f4fc;--celeste-200:#c4e5f7;--celeste-400:#5cbbea;--celeste-700:#0b6fa4;--celeste-800:#0a5f8e;--ink:#0b2a3f;--ink-muted:#4a6475;--on-ink:#e6f4fc;--on-ink-muted:#a9c9dc;--on-primary:#ffffff;--line:#d4e6f0;--line-strong:#77909f;--success:#1c7a52;--success-soft:#e7f5ee;--warning:#9a5a06;--warning-soft:#fdf3e3;--danger:#b42318;--space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:40px;--space-6:96px;--radius-sm:6px;--radius-md:10px;--radius-lg:20px;--radius-full:999px;--shadow-pop:0 8px 24px rgba(11, 42, 63, 0.12);--font-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;--font-sans:"Public Sans", "Helvetica Neue", Arial, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--surface-soft);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input,textarea,select{font:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--font-mono);font-size:11px;line-height:16px;letter-spacing:.08em;font-weight:500;text-transform:uppercase}
.muted{color:var(--ink-muted)}
.disp{font-family:var(--font-display);font-weight:600}
#app{height:100vh;min-height:600px;position:relative;overflow:hidden}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-sm);font-weight:600;border:1px solid transparent;white-space:nowrap}
.btn-p{background:var(--celeste-700);color:var(--on-primary)}.btn-p:hover{background:var(--celeste-800)}
.btn-s{border-color:var(--line-strong);background:var(--surface)}.btn-s:hover{background:var(--surface-soft)}
.btn-g{color:var(--celeste-700)}.btn-g:hover{background:var(--celeste-100)}
.btn-d{color:var(--danger)}.btn-d:hover{background:#fbeceb}
.btn-lg{height:44px;font-size:15px}
.btn-w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--radius-sm);color:var(--ink-muted)}
.ib:hover{background:var(--surface-soft);color:var(--ink)}
.ib[disabled]{opacity:.3;pointer-events:none}
:focus-visible{outline:2px solid var(--celeste-700);outline-offset:2px}
.fld{display:grid;gap:6px}
.fld>label,.lbl{font-weight:500}
.hint{font-size:12px;line-height:16px;color:var(--ink-muted)}
.err{font-size:12px;color:var(--danger);display:flex;gap:6px;align-items:center}
.inp{width:100%;font-size:14px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:9px 12px;color:var(--ink);background:var(--surface);min-height:40px}
.inp::placeholder{color:#8aa0ae}
textarea.inp{resize:vertical;min-height:84px;line-height:20px}
.inp.bad{border-color:var(--danger)}
.pre{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.pre span{padding:9px 10px;background:var(--surface-soft);color:var(--ink-muted);border-right:1px solid var(--line);white-space:nowrap}
.pre .inp{border:0;border-radius:0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--radius-sm);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-pub{background:var(--success-soft);color:var(--success)}
.t-dr{background:var(--surface-soft);color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--line)}
.t-ch{background:var(--warning-soft);color:var(--warning)}
.t-info{background:var(--celeste-100);color:var(--celeste-700)}
.tog{width:40px;height:24px;border-radius:var(--radius-full);background:var(--line-strong);position:relative;flex:none}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.tog.on{background:var(--celeste-700)}.tog.on:after{left:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-h h2,.h2{font-family:var(--font-display);font-size:16px;line-height:22px;font-weight:600}
.card-b{padding:20px}
.seg{display:inline-flex;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:4px;font-weight:600;color:var(--ink-muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(11,42,63,.12)}
.av{width:32px;height:32px;border-radius:50%;background:var(--celeste-400);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.av.b{background:var(--celeste-200)}
.av.c{background:var(--celeste-100)}
.empty{padding:28px;text-align:center;color:var(--ink-muted)}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1fr 1fr;height:100%;background:var(--surface)}
.l-art{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden;padding:40px 48px;display:flex;flex-direction:column}
.l-art .sky{position:absolute;left:48px;right:48px;bottom:48px;height:52%;border-radius:var(--radius-lg);background:var(--celeste-700);overflow:hidden}
.l-art .sun{position:absolute;width:150px;height:150px;border-radius:50%;background:var(--celeste-100);right:60px;top:40px}
.l-art .c1{position:absolute;left:-50px;bottom:-110px;width:320px;height:230px;border-radius:50%;background:var(--celeste-400)}
.l-art .c2{position:absolute;left:180px;bottom:-140px;width:380px;height:240px;border-radius:50%;background:var(--celeste-200)}
.l-art .rule{position:absolute;left:0;right:0;height:1px;background:var(--celeste-400);opacity:.5}
.l-art h1{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:44px;letter-spacing:-.015em;margin-top:64px;max-width:14ch}
.l-art p{color:var(--on-ink-muted);font-size:16px;line-height:24px;margin-top:14px;max-width:36ch}
.l-form{display:flex;flex-direction:column;justify-content:center;padding:48px;max-width:520px;margin:0 auto;width:100%}
.l-form h2{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:34px;margin:10px 0 6px}
.l-form form{display:grid;gap:18px;margin-top:28px}
.pw{position:relative}.pw .inp{padding-right:44px}.pw .ib{position:absolute;right:4px;top:3px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.box{width:18px;height:18px;border:1px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);flex:none}
.box.on{background:var(--celeste-700);border-color:var(--celeste-700);color:var(--on-primary)}
.box svg.i{width:14px;height:14px;stroke-width:2.2}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lnk{color:var(--celeste-700);font-weight:600}
.lnk:hover{text-decoration:underline}
.l-foot{margin-top:40px;font-size:12px;color:var(--ink-muted)}
.ok{background:var(--success-soft);color:var(--success);border-radius:var(--radius-md);padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.ok b{display:block}
.ok span{color:var(--ink)}
.brand{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand .dot{width:20px;height:10px;border-radius:20px 20px 0 0;background:var(--celeste-400)}
.brand small{font-family:var(--font-sans);font-weight:500;font-size:12px;letter-spacing:0;color:var(--on-ink-muted)}
.brand.dk small{color:var(--ink-muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;padding:20px 12px;min-height:0}
.side .brand{padding:4px 10px 24px}
.grp{color:var(--on-ink-muted);padding:16px 10px 8px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--on-ink-muted);font-weight:500}
.nav a:hover{background:rgba(169,201,220,.1);color:var(--on-ink)}
.nav a.on{background:var(--celeste-700);color:var(--on-primary)}
.nav .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--warning-soft);color:var(--warning);font-size:11px;font-weight:700;display:grid;place-items:center}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px 4px;border-top:1px solid rgba(169,201,220,.2)}
.me b{display:block;font-weight:600}.me span{font-size:12px;color:var(--on-ink-muted)}
.me .ib{margin-left:auto;color:var(--on-ink-muted)}.me .ib:hover{background:rgba(169,201,220,.1);color:var(--on-ink)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:60px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:10px}
.crumb{color:var(--ink-muted);display:flex;align-items:center;gap:6px;min-width:0}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend{display:inline-flex;align-items:center;gap:8px;background:var(--warning-soft);color:var(--warning);height:36px;padding:0 12px;border-radius:var(--radius-sm);font-weight:600}
.pend:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sp{flex:1}
.scroll{flex:1;overflow:auto;min-height:0}
.pg{padding:28px;max-width:1120px}
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.pg-h .mono{color:var(--celeste-700)}
.pg-h h1{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:32px;margin-top:4px}
.pg-h p{color:var(--ink-muted);margin-top:4px;max-width:62ch}
.mtop,.tabbar{display:none}

/* ---------- tables ---------- */
.tbl .tr{display:grid;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.tbl .tr:last-child{border-bottom:0}
.tbl .th{padding-top:10px;padding-bottom:10px;background:var(--surface-soft);color:var(--ink-muted);font-size:12px;font-weight:600;border-radius:var(--radius-md) var(--radius-md) 0 0}
.tbl .tr.click{cursor:pointer}.tbl .tr.click:hover{background:var(--surface-soft)}
.tbl b{font-weight:600}
.pgt{grid-template-columns:28px minmax(0,1.6fr) minmax(0,1.3fr) 90px 150px 100px 80px}
.pgi{width:28px;height:28px;border-radius:6px;background:var(--celeste-100);color:var(--celeste-700);display:grid;place-items:center}
.pgi svg.i{width:16px;height:16px}
.url{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;justify-content:flex-end;gap:2px}
.ut{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) 150px 130px 90px}
.cell-u{display:flex;gap:12px;align-items:center;min-width:0}
.cell-u div{min-width:0}.cell-u span{display:block;font-size:12px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.hello{background:var(--celeste-100);border-radius:var(--radius-md);padding:24px;position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;grid-column:1/-1}
.hello .shape{position:absolute;right:-30px;bottom:-90px;width:260px;height:170px;border-radius:50%;background:var(--celeste-200)}
.hello .shape2{position:absolute;right:150px;bottom:-110px;width:200px;height:150px;border-radius:50%;background:var(--celeste-400)}
.hello>div{position:relative}
.hello h1{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:30px}
.hello p{color:var(--ink-muted);margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;grid-column:1/-1}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;text-align:left;display:grid;gap:10px}
.qa button:hover{border-color:var(--line-strong)}
.qa .qi{width:36px;height:36px;border-radius:8px;background:var(--celeste-100);color:var(--celeste-700);display:grid;place-items:center}
.qa b{font-weight:600}.qa span{font-size:12px;color:var(--ink-muted)}
.pl .tr{grid-template-columns:28px 1fr auto 70px}
.feed{list-style:none}
.feed li{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .dt{font-size:12px;color:var(--ink-muted)}
.pubcard{padding:18px 20px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);background:var(--warning-soft)}
.pubcard b{display:block}

/* ---------- editor ---------- */
.ed{display:grid;grid-template-rows:60px 1fr;height:100%}
.ed-top{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}
.ed-top .ttl{display:flex;flex-direction:column;min-width:0}
.ed-top .ttl b{font-family:var(--font-display);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dirty{display:inline-flex;align-items:center;gap:6px;color:var(--warning);font-size:12px;font-weight:600}
.dirty:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ed-body{display:grid;grid-template-columns:272px 1fr 368px;min-height:0}
.ed-l{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ed-l .hd{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.bl{list-style:none;padding:0 10px;overflow:auto;flex:1}
.bl li{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.bl li:hover{background:var(--surface-soft)}
.bl li.on{background:var(--celeste-100);border-color:var(--celeste-200)}
.bl .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);width:18px}
.bl .bi{width:30px;height:30px;border-radius:6px;background:var(--surface-soft);color:var(--ink-muted);display:grid;place-items:center;flex:none}
.bl li.on .bi{background:var(--surface);color:var(--celeste-700)}
.bl .bn{flex:1;min-width:0}
.bl .bn b{display:block;font-weight:600;font-size:13px}
.bl .bn span{display:block;font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl .mv{display:flex;flex-direction:column}
.bl .mv .ib{width:22px;height:18px}
.bl .mv svg.i{width:14px;height:14px}
.ed-l .add{padding:12px 16px;border-top:1px solid var(--line)}
.ed-c{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface-soft)}
.ed-c .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.pvwrap{flex:1;overflow:auto;padding:0 16px 24px;min-height:0}
.pvbox{margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;box-shadow:0 1px 3px rgba(11,42,63,.06)}
.pvbox.m{border-radius:28px;border:8px solid var(--ink)}
.ed-r{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ed-r .tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px;gap:18px}
.ed-r .tabs button{height:46px;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ed-r .tabs button.on{color:var(--ink);border-color:var(--celeste-700)}
.insp{padding:18px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.insp .bh{display:flex;gap:12px;align-items:center}
.insp .bh .bi{width:40px;height:40px;border-radius:8px;background:var(--celeste-100);color:var(--celeste-700);display:grid;place-items:center}
.insp .bh b{display:block;font-family:var(--font-display);font-size:16px;font-weight:600}
.insp .foot{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icon{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-muted);display:grid;place-items:center}
.icon:hover{border-color:var(--line-strong);color:var(--ink)}
.icon.on{border:2px solid var(--celeste-700);color:var(--celeste-700);background:var(--celeste-100)}
.items{display:grid;gap:8px}
.it{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.it .ih{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;cursor:pointer}
.it .ih .ic{width:28px;height:28px;border-radius:6px;background:var(--celeste-100);color:var(--celeste-700);display:grid;place-items:center;flex:none}
.it .ih .ic svg.i{width:16px;height:16px}
.it .ih .nm{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ih .ib{width:28px;height:28px}
.it .ib svg.i{width:15px;height:15px}
.it .ibd{padding:4px 12px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.it.open{border-color:var(--line-strong)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.imgs button{border:1px solid var(--line);border-radius:6px;overflow:hidden;height:62px;padding:0}
.imgs button.on{outline:2px solid var(--celeste-700);outline-offset:1px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-md)}
.swrow b{display:block;font-weight:600}.swrow span{font-size:12px;color:var(--ink-muted)}
.note{background:var(--celeste-100);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:18px;color:var(--ink);display:flex;gap:8px}
.note svg.i{color:var(--celeste-700);margin-top:1px}

/* ---------- thumbnails ---------- */
.th-img{position:relative;width:100%;height:100%;overflow:hidden;background:var(--celeste-100)}
.th-img i{position:absolute;border-radius:50%}
.v1 i:nth-child(1){width:60%;height:70%;left:-10%;bottom:-35%;background:var(--celeste-400)}
.v1 i:nth-child(2){width:70%;height:80%;left:35%;bottom:-45%;background:var(--celeste-700)}
.v1 i:nth-child(3){width:26%;height:40%;right:14%;top:12%;background:var(--surface)}
.v2{background:var(--ink)}
.v2 i:nth-child(1){width:44%;height:66%;left:10%;top:16%;background:var(--celeste-400)}
.v2 i:nth-child(2){width:44%;height:66%;left:46%;top:16%;background:var(--celeste-200);opacity:.9}
.v3{background:var(--celeste-200)}
.v3 i:nth-child(1){width:90%;height:140%;left:5%;top:50%;background:var(--celeste-700)}
.v3 i:nth-child(2){width:20%;height:30%;left:40%;top:18%;background:var(--surface)}
.v4{background:var(--celeste-700)}
.v4 i:nth-child(1){width:34%;height:52%;left:12%;top:24%;background:var(--celeste-100);border-radius:12%}
.v4 i:nth-child(2){width:34%;height:52%;left:54%;top:24%;background:var(--celeste-400);border-radius:12%}
.v5 i:nth-child(1){width:120%;height:60%;left:-10%;bottom:-20%;background:var(--celeste-200)}
.v5 i:nth-child(2){width:30%;height:44%;left:20%;top:16%;background:var(--celeste-700)}
.v5 i:nth-child(3){width:18%;height:26%;left:58%;top:26%;background:var(--celeste-400)}
.v6{background:var(--surface-soft)}
.v6 i:nth-child(1){width:50%;height:74%;left:25%;top:13%;background:var(--celeste-400)}
.v6 i:nth-child(2){width:24%;height:36%;left:38%;top:32%;background:var(--surface)}

/* ---------- media / menu / settings ---------- */

function field(f,val,path){
  var key=f[0],lab=f[1],type=f[2],id='f_'+path.replace(/\./g,'_');
  if(type==='text')return '<div class="fld"><label for="'+id+'">'+lab+'</label><input class="inp" id="'+id+'" data-f="'+path+'" value="'+esc(val)+'"></div>';
  if(type==='textarea')return '<div class="fld"><label for="'+id+'">'+lab+'</label><textarea class="inp" id="'+id+'" data-f="'+path+'">'+esc(val)+'</textarea></div>';
  if(type==='icon')return '<div class="fld"><span class="lbl">'+lab+'</span><div class="icons">'+CATALOG.map(function(n){return '<button class="icon'+(n===val?' on':'')+'" data-act="setv" data-arg="'+path+'|'+n+'" aria-label="'+n+'">'+I(n)+'</button>';}).join('')+'</div></div>';
  if(type==='image')return '<div class="fld"><span class="lbl">'+lab+'</span><div class="imgs">'+S.images.map(function(x){return '<button class="'+(x.id===val?'on':'')+'" data-act="setv" data-arg="'+path+'|'+x.id+'" aria-label="'+esc(x.alt)+'">'+thumb(x.id)+'</button>';}).join('')+'</div><span class="hint">Las imágenes se suben en Imágenes.</span></div>';
  if(type==='select')return '<div class="fld"><label for="'+id+'">'+lab+'</label><select class="inp" id="'+id+'" data-f="'+path+'">'+f[3].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div>';
  if(type==='page')return '<div class="fld"><label for="'+id+'">'+lab+'</label><select class="inp" id="'+id+'" data-f="'+path+'">'+S.pages.map(function(p){return '<option value="'+p.id+'"'+(p.id===val?' selected':'')+'>'+esc(p.title)+' ('+url(p)+')</option>';}).join('')+'</select></div>';
  if(type==='bool')return '<div class="swrow"><div><b>'+lab+'</b><span>'+(val?'Visible en la página':'Oculto')+'</span></div><button class="tog'+(val?' on':'')+'" data-act="togv" data-arg="'+path+'" aria-label="'+lab+'"></button></div>';
  if(type==='list'){
    var sub=f[3];
    return '<div class="fld"><div class="row-sb"><span class="lbl">'+lab+' <span class="muted" style="font-weight:400">· '+val.length+'</span></span><button class="btn btn-g" style="height:30px;padding:0 8px" data-act="additem" data-arg="'+path+'">'+I('plus')+'Agregar</button></div><div class="items">'+val.map(function(it,i){
      var open=S.ui.open===i, nm=it.titulo||it.nombre||it.valor||('Elemento '+(i+1));
      return '<div class="it'+(open?' open':'')+'"><div class="ih" data-act="openitem" data-arg="'+i+'">'+(it.icono?'<span class="ic">'+I(it.icono)+'</span>':'<span class="mono muted" style="width:22px">'+String(i+1).padStart(2,'0')+'</span>')+'<span class="nm">'+esc(nm)+'</span><button class="ib" data-act="mvitem" data-arg="'+path+'|'+i+'|-1" aria-label="Subir"'+(i===0?' disabled':'')+'>'+I('up')+'</button><button class="ib" data-act="mvitem" data-arg="'+path+'|'+i+'|1" aria-label="Bajar"'+(i===val.length-1?' disabled':'')+'>'+I('down')+'</button><button class="ib" data-act="delitem" data-arg="'+path+'|'+i+'" aria-label="Eliminar">'+I('trash')+'</button></div>'+
      (open?'<div class="ibd">'+sub.map(function(sf){return field(sf,it[sf[0]],path+'.'+i+'.'+sf[0]);}).join('')+'</div>':'')+'</div>';
    }).join('')+'</div></div>';
  }
  return '';
}
function getPath(obj,path){return path.split('.').reduce(function(o,k){return o==null?o:o[k];},obj);}
function setPath(obj,path,v){var ks=path.split('.'),o=obj;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}

var VIEWS={login:vLogin,recuperar:vLogin,inicio:vInicio,paginas:vPaginas,editor:vEditor,menu:vMenu,imagenes:vImagenes,usuarios:vUsuarios,historial:vHistorial,ajustes:vAjustes};

function fitPreview(){
  var w=document.getElementById('pvwrap'),b=document.getElementById('pvbox'),pv=document.getElementById('pv');
  if(!w||!pv)return;
  var m=S.ui.dev==='m'||mobile(),base=m?375:1200,avail=w.clientWidth-(mobile()?32:32);

/* diff helpers */
function flat(o,pre,out){out=out||{};for(var k in o){var v=o[k],p=pre?pre+'.'+k:k;if(v&&typeof v==='object')flat(v,p,out);else out[p]=v;}return out;}
function label(p,path){
  var parts=path.split('.');if(parts[0]==='title')return 'Nombre de la página';if(parts[0]==='slug')return 'Dirección';if(parts[0]==='seo')return 'Descripción para buscadores';if(parts[0]==='status')return 'Visibilidad';
  if(parts[0]==='blocks'){var b=p.blocks[+parts[1]];if(!b)return 'Bloques';var sc=B[b.t],f=null;sc.fields.forEach(function(x){if(x[0]===parts[3])f=x;});var s=sc.name+' · '+(f?f[1]:parts[3]);
    if(f&&f[2]==='list'&&parts[4]!=null){var it=b.d[parts[3]][+parts[4]];var sf=null;f[3].forEach(function(x){if(x[0]===parts[5])sf=x;});s=sc.name+' · '+(it?(it.titulo||it.nombre||it.valor||'Elemento'):'Elemento')+' · '+(sf?sf[1]:'');}return s;}
  return path;
}
