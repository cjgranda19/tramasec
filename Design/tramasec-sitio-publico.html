<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600&display=swap">
<title>Tramasec</title>
<meta name="description" content="Tecnología, datos y seguridad para bancos, cooperativas y comercios.">
<style>:root{--surface:#ffffff;--surface-soft:#f3f8fb;--celeste-100:#e6f4fc;--celeste-200:#c4e5f7;--celeste-400:#5cbbea;--celeste-700:#0b6fa4;--celeste-800:#0a5f8e;--ink:#0b2a3f;--ink-muted:#4a6475;--on-ink:#e6f4fc;--on-ink-muted:#a9c9dc;--on-primary:#ffffff;--line:#d4e6f0;--line-strong:#77909f;--success:#1c7a52;--success-soft:#e7f5ee;--warning:#9a5a06;--warning-soft:#fdf3e3;--danger:#b42318;--space-1:4px;--space-2:8px;--space-3:16px;--space-4:24px;--space-5:40px;--space-6:96px;--radius-sm:6px;--radius-md:10px;--radius-lg:20px;--radius-full:999px;--shadow-pop:0 8px 24px rgba(11, 42, 63, 0.12);--font-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;--font-sans:"Public Sans", "Helvetica Neue", Arial, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;}</style>
<style>
html{scroll-behavior:smooth}body{margin:0;background:var(--surface)}
.site *{box-sizing:border-box;margin:0;padding:0}
.site{background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
.site a{color:inherit;text-decoration:none}
.site button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.site input,.site textarea,.site select{font:inherit}
.site svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.site :focus-visible{outline:2px solid var(--celeste-700);outline-offset:2px}
.site .w{max-width:1200px;margin:0 auto;padding:0 64px}
.site .eb{font-family:var(--font-mono);font-size:12px;line-height:16px;letter-spacing:.08em;font-weight:500;color:var(--celeste-700);text-transform:uppercase}
.site .h1{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:46px;letter-spacing:-.015em}
.site .h2{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px}
.site .lead{font-size:19px;line-height:30px;color:var(--ink-muted)}
.site .mut{color:var(--ink-muted)}
.site .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:background .15s}
.site .btn svg.i{width:18px;height:18px}
.site .btn-p{background:var(--celeste-700);color:var(--on-primary)}
.site .btn-p:hover{background:var(--celeste-800)}
.site .btn-s{border-color:var(--line-strong);background:var(--surface);color:var(--ink)}
.site .btn-s:hover{background:var(--surface-soft)}
.site .btn-l{background:var(--surface);color:var(--ink)}
.site .btn-l:hover{background:var(--celeste-100)}
.site .lnk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--celeste-700)}
.site .lnk svg.i{width:16px;height:16px;transition:transform .15s}
.site .lnk:hover svg.i{transform:translateX(3px)}
.site .lnk:hover span{text-decoration:underline}
.site .hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site .hd .w{height:76px;display:flex;align-items:center;gap:40px}
.site .brand{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.site .brand .dot{width:22px;height:11px;border-radius:22px 22px 0 0;background:var(--celeste-400)}
.site .snav{display:flex;gap:6px;flex:1;justify-content:center}
.site .snav a{padding:8px 14px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;color:var(--ink-muted);position:relative}
.site .snav a:hover{color:var(--ink);background:var(--surface-soft)}
.site .snav a.on{color:var(--ink)}
.site .snav a.on:after{content:"";position:absolute;left:14px;right:14px;bottom:-19px;height:3px;border-radius:3px 3px 0 0;background:var(--celeste-700)}
.site .burger{display:none;width:44px;height:44px;place-items:center;border-radius:var(--radius-sm);margin-left:auto}
.site .burger:hover{background:var(--surface-soft)}
.site .mnav{position:fixed;inset:0;z-index:60;background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;visibility:hidden}
.site .mnav.open{transform:none;visibility:visible}
.site .mnav .top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;border-bottom:1px solid var(--line)}
.site .mnav ul{list-style:none;padding:12px 20px;flex:1}
.site .mnav li a{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-family:var(--font-display);font-size:22px;font-weight:600}
.site .mnav li a.on{color:var(--celeste-700)}
.site .mnav li a svg.i{color:var(--ink-muted)}
.site .mnav .bot{padding:20px;border-top:1px solid var(--line);display:grid;gap:14px;background:var(--surface-soft)}
.site .mnav .bot .btn{width:100%}
.site .mnav .bot small{color:var(--ink-muted);font-size:13px;line-height:20px}
.site .hero{background:var(--celeste-100);overflow:hidden}
.site .hero .w{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;padding-top:88px;padding-bottom:96px;align-items:center}
.site .hero h1{font-family:var(--font-display);font-weight:600;font-size:64px;line-height:66px;letter-spacing:-.02em;margin:20px 0 24px}
.site .hero h1 em{font-style:normal;color:var(--celeste-700)}
.site .hero .lead{max-width:40ch}
.site .hero .ac{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
.site .sky{position:relative;height:420px;border-radius:var(--radius-lg);background:var(--celeste-200);overflow:hidden}
.site .sky .sun{position:absolute;width:220px;height:220px;border-radius:50%;background:var(--surface);right:70px;top:60px}
.site .sky .c1{position:absolute;left:-40px;bottom:-120px;width:360px;height:260px;border-radius:50%;background:var(--celeste-400)}
.site .sky .c2{position:absolute;left:220px;bottom:-150px;width:420px;height:260px;border-radius:50%;background:var(--celeste-700)}
.site .sky .rule{position:absolute;left:0;right:0;height:1px;background:var(--surface);opacity:.7}
.site .hnote{position:absolute;left:28px;top:28px;background:var(--surface);border-radius:var(--radius-md);padding:16px 18px;width:260px;box-shadow:var(--shadow-pop)}
.site .hnote .eb{font-size:11px;color:var(--success);display:flex;gap:6px;align-items:center}
.site .hnote .eb:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.site .hnote b{display:block;font-size:15px;line-height:22px}
.site .hnote span{font-size:13px;line-height:19px;color:var(--ink-muted)}
.site .ph{background:var(--celeste-100);position:relative;overflow:hidden}
.site .ph .w{padding-top:56px;padding-bottom:64px;position:relative;z-index:1}
.site .ph .crumb{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-muted);margin-bottom:28px}
.site .ph .crumb a:hover{color:var(--ink);text-decoration:underline}
.site .ph .crumb svg.i{width:14px;height:14px}
.site .ph h1{font-family:var(--font-display);font-weight:600;font-size:52px;line-height:56px;letter-spacing:-.02em;margin:16px 0 18px;max-width:18ch}
.site .ph .lead{max-width:52ch}
.site .ph .ac{display:flex;gap:12px;margin-top:28px}
.site .ph .arc{position:absolute;right:-60px;bottom:-190px;width:520px;height:340px;border-radius:50%;background:var(--celeste-200)}
.site .ph .arc2{position:absolute;right:250px;bottom:-230px;width:360px;height:300px;border-radius:50%;background:var(--celeste-400)}
.site .ph .sunb{position:absolute;right:140px;top:44px;width:110px;height:110px;border-radius:50%;background:var(--surface)}
.site .ph .ico-big{width:64px;height:64px;border-radius:var(--radius-md);background:var(--surface);color:var(--celeste-700);display:grid;place-items:center;margin-bottom:22px}
.site .ph .ico-big svg.i{width:34px;height:34px}
.site .sec{padding:96px 0}
.site .alt{background:var(--surface-soft)}
.site .sh{display:grid;grid-template-columns:300px 1fr;gap:40px;margin-bottom:52px}
.site .sh .lead{margin-top:14px;max-width:54ch}
.site .sh .row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.site .txt{display:grid;grid-template-columns:300px 1fr;gap:40px}
.site .txt .body p{color:var(--ink-muted);max-width:62ch;margin-top:16px}
.site .txt .body .cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.site .txt blockquote{font-family:var(--font-display);font-size:32px;line-height:40px;font-weight:500;letter-spacing:-.01em;max-width:24ch}
.site .txt blockquote u{text-decoration:none;box-shadow:inset 0 -10px 0 var(--celeste-200)}
.site .facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:48px}
.site .facts div{padding:22px 24px 0 0}
.site .facts div+div{padding-left:24px;border-left:1px solid var(--line)}
.site .facts strong{display:block;font-family:var(--font-display);font-size:26px;line-height:32px;font-weight:600;white-space:nowrap}
.site .facts span{font-size:14px;color:var(--ink-muted)}
.site .grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);overflow:hidden}
.site .cell{padding:32px 28px 28px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:280px;transition:background .15s}
.site a.cell:hover{background:var(--surface-soft)}
.site a.cell:hover .ico{background:var(--celeste-700);color:var(--on-primary)}
.site .cell .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);letter-spacing:.08em;align-self:flex-end;margin-bottom:-18px}
.site .ico{width:56px;height:56px;border-radius:var(--radius-md);background:var(--celeste-100);color:var(--celeste-700);display:grid;place-items:center;margin-bottom:28px;transition:background .15s,color .15s}
.site .ico svg.i{width:30px;height:30px}
.site .cell h3{font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:600;margin-bottom:10px}
.site .cell p{font-size:15px;line-height:24px;color:var(--ink-muted);flex:1}
.site .cell .lnk{margin-top:20px}
.site .grid.two{grid-template-columns:repeat(2,1fr)}
.site .grid.two .cell{min-height:0}
.site .aud{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.site .aud div{padding-top:24px;border-top:3px solid var(--celeste-400)}
.site .aud h3{font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:600;margin:10px 0 8px}
.site .aud p{color:var(--ink-muted);font-size:15px;line-height:24px}
.site .team{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.site .pf{height:260px;border-radius:var(--radius-md);background:var(--celeste-100);position:relative;overflow:hidden;margin-bottom:18px}
.site .pf i{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);width:170px;height:170px;border-radius:50%;background:var(--celeste-200)}
.site .pf b{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:var(--celeste-400);display:grid;place-items:center;color:var(--ink)}
.site .pf b svg.i{width:34px;height:34px}
.site .team h3{font-family:var(--font-display);font-size:18px;line-height:24px;font-weight:600}
.site .team span{font-size:14px;color:var(--ink-muted)}
.site .tl{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:24px;padding-top:40px}
.site .tl:before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;background:var(--celeste-400);border-radius:3px}
.site .tl .y{position:relative}
.site .tl .y:before{content:"";position:absolute;top:-37px;left:0;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--celeste-700)}
.site .tl strong{font-family:var(--font-mono);font-size:13px;letter-spacing:.08em;color:var(--celeste-700);text-transform:uppercase}
.site .tl h3{font-family:var(--font-display);font-size:18px;line-height:24px;font-weight:600;margin:6px 0}
.site .tl p{font-size:14px;line-height:22px;color:var(--ink-muted)}
.site .it2{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.site .it2.r .im{order:2}
.site .it2 .im{height:400px;border-radius:var(--radius-lg);overflow:hidden}
.site .it2 .h1{margin:16px 0 0}
.site .it2 p{color:var(--ink-muted);margin-top:16px;max-width:52ch}
.site .it2 ul{list-style:none;margin-top:24px;display:grid;gap:12px}
.site .it2 li{display:flex;gap:12px;align-items:flex-start}
.site .it2 li svg.i{color:var(--celeste-700);width:20px;height:20px;margin-top:3px}
.site .th-img{position:relative;width:100%;height:100%;overflow:hidden;background:var(--celeste-100)}
.site .th-img i{position:absolute;border-radius:50%}
.site .v1 i:nth-child(1){width:60%;height:70%;left:-10%;bottom:-35%;background:var(--celeste-400)}
.site .v1 i:nth-child(2){width:70%;height:80%;left:35%;bottom:-45%;background:var(--celeste-700)}
.site .v1 i:nth-child(3){width:26%;height:40%;right:14%;top:12%;background:var(--surface)}
.site .v2{background:var(--ink)}
.site .v2 i:nth-child(1){width:44%;height:66%;left:10%;top:16%;background:var(--celeste-400)}
.site .v2 i:nth-child(2){width:44%;height:66%;left:46%;top:16%;background:var(--celeste-200);opacity:.9}
.site .v4{background:var(--celeste-700)}
.site .v4 i:nth-child(1){width:34%;height:52%;left:12%;top:24%;background:var(--celeste-100);border-radius:12%}
.site .v4 i:nth-child(2){width:34%;height:52%;left:54%;top:24%;background:var(--celeste-400);border-radius:12%}
.site .v5 i:nth-child(1){width:120%;height:60%;left:-10%;bottom:-20%;background:var(--celeste-200)}
.site .v5 i:nth-child(2){width:30%;height:44%;left:20%;top:16%;background:var(--celeste-700)}
.site .v5 i:nth-child(3){width:18%;height:26%;left:58%;top:26%;background:var(--celeste-400)}
.site .img-lbl{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.92);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;line-height:16px;color:var(--ink-muted);font-family:var(--font-mono);letter-spacing:.04em}
.site .cta{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden}
.site .cta .w{padding-top:72px;padding-bottom:72px;display:flex;align-items:center;justify-content:space-between;gap:48px;position:relative;z-index:1}
.site .cta .h1{color:var(--on-ink);max-width:20ch}
.site .cta p{color:var(--on-ink-muted);margin-top:12px;font-size:17px;max-width:48ch}
.site .cta .ac{display:flex;gap:12px;flex:none}
.site .cta .arc{position:absolute;right:-80px;top:-160px;width:420px;height:320px;border-radius:50%;background:var(--celeste-700);opacity:.55}
.site .cta .btn-s{background:transparent;color:var(--on-ink);border-color:var(--on-ink-muted)}
.site .cta .btn-s:hover{background:rgba(169,201,220,.12)}
.site .related{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.site .related a{display:flex;gap:16px;align-items:center;padding:18px 20px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.site .related a:hover{border-color:var(--line-strong)}
.site .related .ico{width:44px;height:44px;margin:0}
.site .related .ico svg.i{width:24px;height:24px}
.site .related b{font-family:var(--font-display);font-weight:600;font-size:17px;flex:1}
.site .related a>svg.i{color:var(--celeste-700)}
.site .ct{display:grid;grid-template-columns:1fr 1.1fr;gap:72px;align-items:start}
.site .ci{list-style:none;margin-top:36px;border-top:1px solid var(--line)}
.site .ci li{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.site .ci li svg.i{color:var(--celeste-700);margin-top:2px}
.site .ci b{display:block;font-size:14px;line-height:20px}
.site .ci span{font-size:15px;color:var(--ink-muted)}
.site .ci span.pd{font-style:italic}
.site .frm{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:36px;display:grid;gap:18px}
.site .frm .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.site .fld{display:grid;gap:6px}
.site .fld label{font-size:14px;font-weight:600}
.site .fld label small{font-weight:400;color:var(--ink-muted)}
.site .inp{width:100%;font-size:15px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 14px;color:var(--ink);background:var(--surface);min-height:46px}
.site .inp::placeholder{color:#8aa0ae}
.site textarea.inp{min-height:128px;resize:vertical;line-height:24px}
.site .inp.bad{border-color:var(--danger)}
.site .err{font-size:13px;color:var(--danger);display:flex;gap:6px;align-items:center}
.site .err svg.i{width:15px;height:15px}
.site .chips{display:flex;flex-wrap:wrap;gap:8px}
.site .chip{height:38px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--radius-full);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.site .chip.on{background:var(--celeste-700);border-color:var(--celeste-700);color:var(--on-primary)}
.site .chip svg.i{width:15px;height:15px}
.site .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;line-height:21px;color:var(--ink-muted);cursor:pointer;text-align:left}
.site .box{width:20px;height:20px;border:1px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;background:var(--surface);flex:none;margin-top:1px}
.site .box.on{background:var(--celeste-700);border-color:var(--celeste-700);color:var(--on-primary)}
.site .box svg.i{width:14px;height:14px;stroke-width:2.2}
.site .chk a{color:var(--celeste-700);text-decoration:underline}
.site .file{border:1.5px dashed var(--line-strong);border-radius:var(--radius-md);padding:18px;display:flex;align-items:center;gap:14px;background:var(--surface-soft);text-align:left;width:100%}
.site .file .ico{width:44px;height:44px;margin:0;background:var(--surface)}
.site .file .ico svg.i{width:22px;height:22px}
.site .file b{display:block;font-size:14px}
.site .file span{font-size:13px;color:var(--ink-muted)}
.site .done{text-align:center;padding:24px 8px;display:grid;justify-items:center;gap:12px}
.site .done .ico{width:64px;height:64px;border-radius:50%;background:var(--success-soft);color:var(--success);margin:0}
.site .done h3{font-family:var(--font-display);font-size:24px;line-height:30px;font-weight:600}
.site .done p{color:var(--ink-muted);max-width:40ch}
.site .jobs{display:grid;gap:12px}
.site .job{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:center;padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)}
.site .job h3{font-family:var(--font-display);font-size:19px;font-weight:600}
.site .job .meta{display:flex;gap:16px;font-size:14px;color:var(--ink-muted);flex-wrap:wrap}
.site .job .meta span{display:flex;gap:6px;align-items:center}
.site .job .meta svg.i{width:16px;height:16px}
.site .empty-note{border:1px dashed var(--line-strong);border-radius:var(--radius-md);padding:28px;color:var(--ink-muted);text-align:center;background:var(--surface)}
.site .nf{min-height:calc(100vh - 76px - 360px);display:grid;place-items:center;text-align:center;padding:96px 24px;background:var(--celeste-100);position:relative;overflow:hidden}
.site .nf .num{font-family:var(--font-display);font-weight:600;font-size:160px;line-height:1;color:var(--celeste-200);letter-spacing:-.04em}
.site .nf h1{font-family:var(--font-display);font-weight:600;font-size:36px;line-height:42px;margin-top:-30px;position:relative}
.site .nf p{color:var(--ink-muted);margin:12px auto 28px;max-width:44ch}
.site .nf .ac{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

 reset:function(){F.sent=false;F.mensaje='';F.tema=[];F.acepto=false;render(true);},
 send:function(){var e={};
  if(!F.nombre.trim())e.nombre='Escribe tu nombre.';
  if(!F.correo.trim())e.correo='Escribe tu correo.';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.correo))e.correo='Revisa el correo: debe ser como nombre@empresa.com.';
  if(!F.mensaje.trim())e.mensaje='Cuéntanos brevemente qué necesitas.';
  if(!F.acepto)e.acepto='Necesitamos tu autorización para responderte.';
  F.err=e;if(!Object.keys(e).length)F.sent=true;render(true);
  var ip=app.querySelector('.inp.bad')||app.querySelector('.err');
  if(ip){var r=ip.getBoundingClientRect();if(r.top<90||r.top>window.innerHeight-60)window.scrollBy({top:r.top-120});if(ip.focus)ip.focus({preventScroll:true});}}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){if(t.tagName==='BUTTON'&&!e.target.closest('a'))e.preventDefault();var f=A[t.dataset.act];if(f)f(t.dataset.arg,t,e);if(!e.target.closest('a'))return;}
  var a=e.target.closest('a');
  if(a&&!a.getAttribute('href')){e.preventDefault();}
  if(a&&a.getAttribute('href')===location.hash){menuOpen=false;render();window.scrollTo(0,0);}
});
document.addEventListener('input',function(e){var k=e.target.dataset.ff;if(!k)return;F[k]=e.target.value;if(F.err[k]){delete F.err[k];e.target.classList.remove('bad');var er=e.target.parentNode.querySelector('.err');if(er)er.remove();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menuOpen){menuOpen=false;render(true);}});

onHash();
